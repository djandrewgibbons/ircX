# Every repository's .github/workflows/pr-review.yml; Develop's Update PR Review workflow copies this
# file from the dev repository. The jobs are in dev's .github/workflows/pr-review-jobs.yml; change them there.
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # The checks are named "review / claude" and "review / codex".
  review:
    # The called jobs can hold at most these permissions.
    permissions: { contents: read, pull-requests: write, id-token: write }
    uses: djandrewgibbons/dev/.github/workflows/pr-review-jobs.yml@main
