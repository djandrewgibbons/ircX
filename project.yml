# The Xcode project, generated: `brew install xcodegen && xcodegen`, then open ircX.xcodeproj.
# The app's code is the Swift package beside this file; these targets only wrap it.
name: ircX
options:
  bundleIdPrefix: ai.dxnd
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  ircX:
    path: .
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    PRODUCT_BUNDLE_IDENTIFIER: ai.dxnd.ircX
    PRODUCT_NAME: ircX
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: ircX
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
    INFOPLIST_KEY_NSHumanReadableCopyright: "Apache License 2.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    # Your team, or set it in Xcode's Signing & Capabilities: notifications through APNs need one.
    DEVELOPMENT_TEAM: TN5EHPSRWX
targets:
  macOS:
    type: application
    platform: macOS
    sources: [macOS]
    dependencies:
      - package: ircX
        product: IRCXUI
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
    # The sandbox, with what huddles need: the microphone, the camera, and sockets of their own for ICE
    # (libwebrtc binds UDP ports to reach Cloudflare's Realtime SFU). Sharing a screen needs no entitlement:
    # the system's picker asks, with the usage string below.
    entitlements:
      path: macOS/ircX.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
        # Notifications through APNs; signing for distribution makes it production.
        com.apple.developer.aps-environment: development
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: ircX
        LSApplicationCategoryType: public.app-category.social-networking
        NSMicrophoneUsageDescription: ircX uses the microphone so you can speak in huddles.
        NSCameraUsageDescription: ircX uses the camera so people in a huddle can see you.
        # The system's screen picker asks before a share; this says what for where macOS shows a reason.
        NSScreenCaptureUsageDescription: ircX records the screen or window you pick so people in a huddle can see it.
        CFBundleURLTypes:
          - CFBundleURLName: ai.dxnd.ircX
            CFBundleURLSchemes: [ircx]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  iOS:
    type: application
    platform: iOS
    sources: [iOS]
    dependencies:
      - package: ircX
        product: IRCXUI
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    # Notifications through APNs; signing for distribution makes it production.
    entitlements:
      path: iOS/ircX.entitlements
      properties:
        aps-environment: development
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: ircX
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: ircX uses the microphone so you can speak in huddles.
        NSCameraUsageDescription: ircX uses the camera so people in a huddle can see you.
        # A huddle goes on while ircX is in the background, as a call does.
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: ai.dxnd.ircX
            CFBundleURLSchemes: [ircx]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  macOS:
    build:
      targets:
        macOS: all
  iOS:
    build:
      targets:
        iOS: all
